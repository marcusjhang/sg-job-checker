services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobchecker
      POSTGRES_PASSWORD: jobchecker
      POSTGRES_DB: jobchecker_test
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobchecker -d jobchecker_test"]
      interval: 2s
      timeout: 2s
      retries: 30
