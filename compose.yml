services:
  postgres:
    image: postgres:17-alpine
    container_name: jobchecker-pg
    environment:
      POSTGRES_USER: jobchecker
      POSTGRES_PASSWORD: jobchecker
      POSTGRES_DB: jobchecker
    ports:
      - "5433:5432"
    volumes:
      - jobchecker-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobchecker -d jobchecker"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  jobchecker-pgdata:
